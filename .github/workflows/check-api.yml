name: Check Gemini model availability
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: List supported text models without exposing credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1000', {
            headers: { 'x-goog-api-key': process.env.GEMINI_API_KEY },
            signal: AbortSignal.timeout(30000)
          });
          const payload = await response.json();
          console.log(JSON.stringify({
            httpStatus: response.status,
            apiStatus: /^[A-Z_]+$/.test(payload.error?.status || '') ? payload.error.status : null,
            models: (payload.models || []).filter(m => m.supportedGenerationMethods?.includes('generateContent')).map(m => m.name)
          }));
          JS
